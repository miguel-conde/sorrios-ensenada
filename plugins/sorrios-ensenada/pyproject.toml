[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sorrios-ensenada-tools"
version = "2.0.2"
description = "Development validation and rendering tools for the Sorríos Ensenada plugin"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
render = [
  "Pillow>=10,<13",
]
test = [
  "Pillow>=10,<13",
  "pytest>=8,<10",
  "setuptools>=69",
  "tomli>=2,<3; python_version < '3.11'",
]

[tool.setuptools]
py-modules = []
