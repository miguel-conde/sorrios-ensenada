<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="940" viewBox="0 0 1200 940" role="img" aria-labelledby="local-title local-desc">
<title id="local-title">Entorno local de Sorrios y Santibáñez de Ordás</title>
<desc id="local-desc">Mapa contemporáneo del entorno de Ordás con Sorrios, identificado como Sorribos en el expediente de 1752, Santibáñez de Ordás, Santa María de Ordás, Villapodambre, Rioseco de Tapia y Tapia de la Ribera. Incluye el río Luna y límites municipales actuales; no representa límites históricos.</desc>
