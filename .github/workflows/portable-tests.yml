name: Portable Python tests

on:
  push:
  pull_request:

jobs:
  test:
    env:
      REQUIRE_PDFTOPPM: "1"
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Poppler on Ubuntu
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes poppler-utils
      - name: Install Poppler on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install poppler --version=22.11.0.20240421 --allow-downgrade --no-progress --yes
          $chocolateyRoot = if ($env:ChocolateyInstall) {
            $env:ChocolateyInstall
          } else {
            Join-Path $env:ProgramData "chocolatey"
          }

          $popplerTools = Join-Path $chocolateyRoot "lib\poppler\tools"
          $executable = Get-ChildItem -LiteralPath $popplerTools -Filter pdftoppm.exe -Recurse -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -eq $executable) {
            throw "Chocolatey instaló Poppler, pero no se encontró pdftoppm.exe dentro de '$popplerTools'."
          }

          $executable.Directory.FullName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Verify pdftoppm on Ubuntu
        if: runner.os == 'Linux'
        shell: bash
        run: |
          command -v pdftoppm
          pdftoppm -v
      - name: Verify pdftoppm on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-Command pdftoppm -ErrorAction Stop
          pdftoppm -v
      - run: python -m pip install -e "./plugins/sorrios-ensenada[test]"
      - run: python -m pytest
