name: Portable Python tests

on:
  push:
  pull_request:

jobs:
  test:
    env:
      REQUIRE_PDFTOPPM: "1"
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Poppler on Ubuntu
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes poppler-utils
      - name: Install Poppler on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "26.02.0-0"
          $archive = Join-Path $env:RUNNER_TEMP "poppler-$version.zip"
          $destination = Join-Path $env:RUNNER_TEMP "poppler"
          $url = "https://github.com/oschwartz10612/poppler-windows/releases/download/v$version/Release-$version.zip"
          $expectedHash = "993e4a94376ed712fafc7058d724ea0b943d118bbd2305cd9ed55174eb85cda5"

          Invoke-WebRequest -Uri $url -OutFile $archive

          $actualHash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) {
            throw "Hash de Poppler incorrecto: $actualHash"
          }

          Expand-Archive -LiteralPath $archive -DestinationPath $destination -Force
          $executable = Get-ChildItem -LiteralPath $destination -Filter pdftoppm.exe -Recurse -File | Select-Object -First 1
          if ($null -eq $executable) {
            throw "No se encontró pdftoppm.exe en el paquete descargado."
          }

          $executable.Directory.FullName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Verify pdftoppm on Ubuntu
        if: runner.os == 'Linux'
        shell: bash
        run: |
          command -v pdftoppm
          pdftoppm -v
      - name: Verify pdftoppm on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-Command pdftoppm -ErrorAction Stop
          pdftoppm -v
      - run: python -m pip install -e "./plugins/sorrios-ensenada[test]"
      - run: python -m pytest
